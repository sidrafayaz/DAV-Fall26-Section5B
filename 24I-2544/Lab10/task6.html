<!doctype html>
<html>
<head>
  <title>Lab 10 - Task 6</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <h2>Task 6: Average PM2.5 by Month and Weekday</h2>
  <svg width="900" height="560"></svg>

  <script>
    d3.csv("air_quality_2025.csv").then(data => {
      const parseDate = d3.timeParse("%Y-%m-%d");
      const months = d3.range(12);
      const weekdays = d3.range(7);
      const weekdayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

      data.forEach(d => {
        d.date = parseDate(d.date);
        d.pm25_city = +d.pm25_city;
      });

      const averages = d3.rollup(
        data,
        values => d3.mean(values, d => d.pm25_city),
        d => d.date.getMonth(),
        d => d.date.getDay()
      );

      const cells = months.flatMap(month =>
        weekdays.map(weekday => ({
          month,
          weekday,
          value: averages.get(month)?.get(weekday)
        }))
      );

      const svg = d3.select("svg");
      const margin = { top: 30, right: 100, bottom: 45, left: 80 };
      const width = 700;
      const height = 450;
      const chart = svg.append("g")
        .attr("transform", `translate(${margin.left}, ${margin.top})`);

      const x = d3.scaleBand()
        .domain(weekdays)
        .range([0, width])
        .padding(0.04);

      const y = d3.scaleBand()
        .domain(months)
        .range([0, height])
        .padding(0.04);

      const color = d3.scaleSequential(d3.interpolateYlOrRd)
        .domain(d3.extent(cells, d => d.value));

      chart.selectAll("rect.cell")
        .data(cells)
        .join("rect")
        .attr("class", "cell")
        .attr("x", d => x(d.weekday))
        .attr("y", d => y(d.month))
        .attr("width", x.bandwidth())
        .attr("height", y.bandwidth())
        .attr("fill", d => color(d.value))
        .append("title")
        .text(d =>
          `${d3.timeFormat("%B")(new Date(2025, d.month, 1))}, ` +
          `${weekdayNames[d.weekday]}: ${d.value.toFixed(1)}`
        );

      chart.append("g")
        .call(d3.axisTop(x).tickFormat(d => weekdayNames[d]));

      chart.append("g")
        .call(d3.axisLeft(y).tickFormat(d =>
          d3.timeFormat("%B")(new Date(2025, d, 1))
        ));

      const legend = chart.append("g")
        .attr("transform", `translate(${width + 25}, 0)`);

      const colorDomain = color.domain();
      const legendScale = d3.scaleLinear()
        .domain(colorDomain)
        .range([height, 0]);

      legend.selectAll("rect")
        .data(d3.range(height))
        .join("rect")
        .attr("y", d => d)
        .attr("width", 18)
        .attr("height", 1)
        .attr("fill", d => color(legendScale.invert(d)));

      legend.append("g")
        .attr("transform", "translate(18, 0)")
        .call(d3.axisRight(legendScale).ticks(6));
    });
  </script>
</body>
</html>
