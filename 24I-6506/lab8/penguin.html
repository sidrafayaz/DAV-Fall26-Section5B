
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gapminder Dataset - Task 1</title>

    <!-- D3.js library -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 25px;
            background-color: #f8f9fa;
        }

        h1 {
            text-align: center;
        }

        .buttons {
            text-align: center;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #333;
            color: white;
            font-size: 15px;
        }

        button:hover {
            background-color: #555;
        }

        #chart {
            max-width: 1000px;
            margin: auto;
        }

        .tooltip {
            position: absolute;
            background: white;
            border: 1px solid #777;
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
            opacity: 0;
            font-size: 13px;
        }

        .error {
            color: red;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>Top 10 Countries by GDP per Capita</h1>

    <div class="buttons">
        <button id="year1952">Year 1952</button>
        <button id="year2007">Year 2007</button>
    </div>

    <div id="chart"></div>
    <div class="tooltip" id="tooltip"></div>

    <script>
        const margin = {
            top: 30,
            right: 40,
            bottom: 60,
            left: 150
        };

        const width = 900;
        const height = 520;

        const svg = d3.select("#chart")
            .append("svg")
            .attr("width", "100%")
            .attr("viewBox", `0 0 ${width} ${height}`);

        const chartWidth = width - margin.left - margin.right;
        const chartHeight = height - margin.top - margin.bottom;

        const chart = svg.append("g")
            .attr("transform",
                `translate(${margin.left},${margin.top})`);

        const xScale = d3.scaleLinear()
            .range([0, chartWidth]);

        const yScale = d3.scaleBand()
            .range([0, chartHeight])
            .padding(0.2);

        const colorScale = d3.scaleOrdinal()
            .domain([
                "Asia",
                "Europe",
                "Africa",
                "Americas",
                "Oceania"
            ])
            .range([
                "#e76f51",
                "#457b9d",
                "#2a9d8f",
                "#e9c46a",
                "#9b5de5"
            ]);

        const xAxis = chart.append("g")
            .attr("transform", `translate(0,${chartHeight})`);

        const yAxis = chart.append("g");

        chart.append("text")
            .attr("class", "x-label")
            .attr("x", chartWidth / 2)
            .attr("y", chartHeight + 48)
            .attr("text-anchor", "middle")
            .text("GDP per Capita");

        const tooltip = d3.select("#tooltip");

        let allData = [];

        // Load the CSV file from the same folder as this HTML file.
        d3.csv("gapminder.csv", d3.autoType)
            .then(function(data) {
                console.log("CSV loaded successfully:", data);
                console.log("Number of rows:", data.length);
                console.log("Column names:", data.columns);

                allData = data;

                updateChart(2007);
            })
            .catch(function(error) {
                console.error("Actual error loading or processing data:", error);

                d3.select("#chart")
                    .append("p")
                    .attr("class", "error")
                    .text("Error: " + error.message +
                        ". Check the browser console and Network tab.");
            });

        function updateChart(selectedYear) {
            const filteredData = allData
                .filter(d =>
                    d.year === selectedYear &&
                    Number.isFinite(d.gdpPercap)
                )
                .sort((a, b) => b.gdpPercap - a.gdpPercap)
                .slice(0, 10);

            console.log("Displaying year:", selectedYear);
            console.log("Top 10 countries:", filteredData);

            if (filteredData.length === 0) {
                console.error("No data found for year:", selectedYear);
                return;
            }

            xScale.domain([
                0,
                d3.max(filteredData, d => d.gdpPercap) * 1.1
            ]);

            yScale.domain(
                filteredData.map(d => d.country)
            );

            xAxis.transition()
                .duration(500)
                .call(
                    d3.axisBottom(xScale)
                        .ticks(6)
                        .tickFormat(d3.format(",.0f"))
                );

            yAxis.transition()
                .duration(500)
                .call(d3.axisLeft(yScale));

            const bars = chart.selectAll(".bar")
                .data(filteredData, d => d.country);

            bars.exit()
                .transition()
                .duration(300)
                .attr("width", 0)
                .remove();

            bars.enter()
                .append("rect")
                .attr("class", "bar")
                .attr("x", 0)
                .attr("y", d => yScale(d.country))
                .attr("height", yScale.bandwidth())
                .attr("width", 0)
                .attr("fill", d => colorScale(d.continent))
                .on("mouseover", function(event, d) {
                    tooltip
                        .style("opacity", 1)
                        .html(
                            "<strong>" + d.country + "</strong><br>" +
                            "Continent: " + d.continent + "<br>" +
                            "Year: " + d.year + "<br>" +
                            "GDP per Capita: $" +
                            d3.format(",.2f")(d.gdpPercap)
                        );
                })
                .on("mousemove", function(event) {
                    tooltip
                        .style("left", (event.pageX + 12) + "px")
                        .style("top", (event.pageY - 25) + "px");
                })
                .on("mouseout", function() {
                    tooltip.style("opacity", 0);
                })
                .merge(bars)
                .transition()
                .duration(500)
                .attr("y", d => yScale(d.country))
                .attr("height", yScale.bandwidth())
                .attr("width", d => xScale(d.gdpPercap))
                .attr("fill", d => colorScale(d.continent));
        }

        // Buttons to change the displayed year.
        d3.select("#year1952")
            .on("click", function() {
                updateChart(1952);
            });

        d3.select("#year2007")
            .on("click", function() {
                updateChart(2007);
            });
    </script>

</body>
</html>
